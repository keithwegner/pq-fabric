name: local-validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go-local-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: make verify
      - run: make docs-check
      - run: make repo-hygiene
