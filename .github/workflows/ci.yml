name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  go-validation:
    name: go validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: make verify
      - run: make docs-check
      - run: make repo-hygiene

  race-validation:
    name: race validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run focused race tests
        run: go test -race ./core/auth ./core/evidence ./core/storage ./core/deployment/bootstrap ./consensus/validator

  contract-validation:
    name: polygon contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: foundry-rs/foundry-toolchain@v1.8.0
        with:
          version: stable
      - name: Run Foundry tests
        working-directory: contracts/polygon
        run: forge test

  macos-smoke:
    name: macos smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./core/... ./consensus/... ./cmd/pqfabric ./cmd/validator
