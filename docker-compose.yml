  validator-5:
    <<: *validator-service
    environment:
      <<: *validator-env
      NODE_ID: validator-5
      REGION: singapore
      PUBLIC_URL: http://validator-5:8080
      DATA_DIR: /data/validator-5
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
