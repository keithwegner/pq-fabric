x-pq-fabric-image: &pq-fabric-image
  image: pq-fabric:local
  build:
    context: .

x-validator-env: &validator-env
  PORT: "8080"
  PQ_FABRIC_CRYPTO_SUITE: ${PQ_FABRIC_CRYPTO_SUITE:-dev}
  PQ_FABRIC_PRODUCTION_MODE: ${PQ_FABRIC_PRODUCTION_MODE:-0}
  API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
  PQFABRIC_API_KEYS_FILE: ${PQFABRIC_API_KEYS_FILE:-}
  PQFABRIC_CONSORTIUM_MANIFEST: ${PQFABRIC_CONSORTIUM_MANIFEST:-}
  PQFABRIC_CONSORTIUM_MANIFEST_HISTORY: ${PQFABRIC_CONSORTIUM_MANIFEST_HISTORY:-}
  PQFABRIC_SIGNER_PROVIDER: ${PQFABRIC_SIGNER_PROVIDER:-local}
  PQFABRIC_ALLOW_LOCAL_SIGNER: ${PQFABRIC_ALLOW_LOCAL_SIGNER:-false}
  PQFABRIC_KMS_KEY_ID: ${PQFABRIC_KMS_KEY_ID:-}
  PQFABRIC_KMS_ENDPOINT: ${PQFABRIC_KMS_ENDPOINT:-}
  PQFABRIC_KMS_TOKEN: ${PQFABRIC_KMS_TOKEN:-}
  PQFABRIC_KMS_CA_FILE: ${PQFABRIC_KMS_CA_FILE:-}
  PQFABRIC_KMS_ALLOW_INSECURE: ${PQFABRIC_KMS_ALLOW_INSECURE:-false}
  PQFABRIC_DATABASE_URL: ${PQFABRIC_DATABASE_URL:-}
  PQFABRIC_PEER_TLS_CERT_FILE: ${PQFABRIC_PEER_TLS_CERT_FILE:-}
  PQFABRIC_PEER_TLS_KEY_FILE: ${PQFABRIC_PEER_TLS_KEY_FILE:-}
  PQFABRIC_PEER_TLS_CA_FILE: ${PQFABRIC_PEER_TLS_CA_FILE:-}
  PQFABRIC_RATE_LIMIT_PER_MINUTE: ${PQFABRIC_RATE_LIMIT_PER_MINUTE:-60}
  PQFABRIC_RATE_LIMIT_BURST: ${PQFABRIC_RATE_LIMIT_BURST:-20}
  PQFABRIC_LOG_FORMAT: ${PQFABRIC_LOG_FORMAT:-}
  PQFABRIC_OTEL_ENABLED: ${PQFABRIC_OTEL_ENABLED:-false}
  PQFABRIC_OTEL_SERVICE_NAME: ${PQFABRIC_OTEL_SERVICE_NAME:-pq-fabric-validator}
  PQFABRIC_OTEL_EXPORTER_OTLP_ENDPOINT: ${PQFABRIC_OTEL_EXPORTER_OTLP_ENDPOINT:-}
  PQFABRIC_OTEL_EXPORTER_OTLP_HEADERS: ${PQFABRIC_OTEL_EXPORTER_OTLP_HEADERS:-}
  PQFABRIC_OTEL_EXPORTER_OTLP_INSECURE: ${PQFABRIC_OTEL_EXPORTER_OTLP_INSECURE:-false}
  STORAGE: durable
  QUORUM_THRESHOLD: "5"
  THRESHOLD: "5"
  ROUTING_MODE: private-testbed
  ANCHOR_BACKEND: mock
  PROPOSAL_TIMEOUT_MS: "700"
  VOTE_TIMEOUT_MS: "700"
  MAX_ROUNDS: "7"
  PEERS: validator-1=http://validator-1:8080,validator-2=http://validator-2:8080,validator-3=http://validator-3:8080,validator-4=http://validator-4:8080,validator-5=http://validator-5:8080,validator-6=http://validator-6:8080,validator-7=http://validator-7:8080

x-validator-service: &validator-service
  <<: *pq-fabric-image
  restart: unless-stopped
  networks:
    - pq-fabric-local
  healthcheck:
    test: ["CMD", "/app/healthcheck", "http://127.0.0.1:8080/health"]
    interval: 30s
    timeout: 5s
    retries: 2

x-relay-service: &relay-service
  <<: *pq-fabric-image
  entrypoint: ["/app/relay"]
  profiles: ["relays"]
  restart: unless-stopped
  networks:
    - pq-fabric-local
  environment:
    PORT: "8080"
    PQ_FABRIC_CRYPTO_SUITE: ${PQ_FABRIC_CRYPTO_SUITE:-dev}
    ROUTING_MODE: private-testbed
    EXIT_POLICY: local-only
  healthcheck:
    test: ["CMD", "/app/healthcheck", "http://127.0.0.1:8080/health"]
    interval: 30s
    timeout: 5s
    retries: 2

services:
  validator-1:
    <<: *validator-service
    environment:
      <<: *validator-env
      NODE_ID: validator-1
      REGION: nyc
      PUBLIC_URL: http://validator-1:8080
      DATA_DIR: /data/validator-1
      AUTO_PROPOSE: "1"
      PROPOSE_INTERVAL_SECONDS: "15"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./data/validator-1:/data/validator-1

  validator-2:
    <<: *validator-service
    environment:
      <<: *validator-env
      NODE_ID: validator-2
      REGION: nyc
      PUBLIC_URL: http://validator-2:8080
      DATA_DIR: /data/validator-2
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./data/validator-2:/data/validator-2

  validator-3:
    <<: *validator-service
    environment:
      <<: *validator-env
      NODE_ID: validator-3
      REGION: london
      PUBLIC_URL: http://validator-3:8080
      DATA_DIR: /data/validator-3
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - ./data/validator-3:/data/validator-3

  validator-4:
    <<: *validator-service
    environment:
      <<: *validator-env
      NODE_ID: validator-4
      REGION: london
      PUBLIC_URL: http://validator-4:8080
      DATA_DIR: /data/validator-4
