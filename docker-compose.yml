  validator-6:
    <<: *validator-service
    environment:
      <<: *validator-env
      NODE_ID: validator-6
      REGION: singapore
      PUBLIC_URL: http://validator-6:8080
      DATA_DIR: /data/validator-6
    ports:
      - "127.0.0.1:8086:8080"
    volumes:
      - ./data/validator-6:/data/validator-6

  validator-7:
    <<: *validator-service
    environment:
      <<: *validator-env
      NODE_ID: validator-7
      REGION: singapore
      PUBLIC_URL: http://validator-7:8080
      DATA_DIR: /data/validator-7
    ports:
      - "127.0.0.1:8087:8080"
    volumes:
      - ./data/validator-7:/data/validator-7

  relay-1:
    <<: *relay-service
    environment:
      RELAY_ID: relay-1
      REGION: nyc
      PQ_FABRIC_CRYPTO_SUITE: ${PQ_FABRIC_CRYPTO_SUITE:-dev}
      ROUTING_MODE: private-testbed

  relay-2:
    <<: *relay-service
    environment:
      RELAY_ID: relay-2
      REGION: nyc
      PQ_FABRIC_CRYPTO_SUITE: ${PQ_FABRIC_CRYPTO_SUITE:-dev}
      ROUTING_MODE: private-testbed

  relay-3:
    <<: *relay-service
    environment:
      RELAY_ID: relay-3
      REGION: london
      PQ_FABRIC_CRYPTO_SUITE: ${PQ_FABRIC_CRYPTO_SUITE:-dev}
      ROUTING_MODE: private-testbed

  relay-4:
    <<: *relay-service
    environment:
      RELAY_ID: relay-4
      REGION: london
      PQ_FABRIC_CRYPTO_SUITE: ${PQ_FABRIC_CRYPTO_SUITE:-dev}
      ROUTING_MODE: private-testbed

  relay-5:
    <<: *relay-service
    environment:
      RELAY_ID: relay-5
      REGION: singapore
      PQ_FABRIC_CRYPTO_SUITE: ${PQ_FABRIC_CRYPTO_SUITE:-dev}
      ROUTING_MODE: private-testbed

  relay-6:
    <<: *relay-service
    environment:
      RELAY_ID: relay-6
      REGION: singapore
      PQ_FABRIC_CRYPTO_SUITE: ${PQ_FABRIC_CRYPTO_SUITE:-dev}
      ROUTING_MODE: private-testbed

  relay-7:
    <<: *relay-service
    environment:
      RELAY_ID: relay-7
      REGION: singapore
      PQ_FABRIC_CRYPTO_SUITE: ${PQ_FABRIC_CRYPTO_SUITE:-dev}
      ROUTING_MODE: private-testbed

  demo:
    <<: *pq-fabric-image
    entrypoint: ["/app/demo"]
    profiles: ["demos"]
    environment:
      PQ_FABRIC_CRYPTO_SUITE: ${PQ_FABRIC_CRYPTO_SUITE:-dev}
    networks:
      - pq-fabric-local

  fault-demo:
    <<: *pq-fabric-image
    entrypoint: ["/app/fault-demo"]
    profiles: ["evidence"]
    environment:
      PQ_FABRIC_CRYPTO_SUITE: ${PQ_FABRIC_CRYPTO_SUITE:-dev}
    volumes:
      - ./tmp:/app/tmp
    networks:
      - pq-fabric-local

  routing-demo:
    <<: *pq-fabric-image
    entrypoint: ["/app/routing-demo"]
    profiles: ["demos", "evidence"]
    environment:
      PQ_FABRIC_CRYPTO_SUITE: ${PQ_FABRIC_CRYPTO_SUITE:-dev}
    volumes:
      - ./tmp:/app/tmp
    networks:
      - pq-fabric-local

  bundle-demo:
    <<: *pq-fabric-image
    entrypoint: ["/app/bundle-demo"]
    profiles: ["demos", "evidence"]
    environment:
      PQ_FABRIC_CRYPTO_SUITE: ${PQ_FABRIC_CRYPTO_SUITE:-dev}
    volumes:
      - ./tmp:/app/tmp
    networks:
      - pq-fabric-local

  anchor-demo:
    <<: *pq-fabric-image
    entrypoint: ["/app/anchor-demo"]
    profiles: ["anchors", "demos", "evidence"]
    environment:
      PQ_FABRIC_CRYPTO_SUITE: ${PQ_FABRIC_CRYPTO_SUITE:-dev}
      ANCHOR_BACKEND: mock
    volumes:
      - ./tmp:/app/tmp
    networks:
      - pq-fabric-local

  deployment-evidence:
    <<: *pq-fabric-image
    entrypoint: ["/app/deployment-evidence"]
    profiles: ["evidence"]
    environment:
      ANCHOR_BACKEND: mock
    volumes:
      - .:/workspace:ro
      - ./tmp:/workspace/tmp
    working_dir: /workspace
    networks:
      - pq-fabric-local

networks:
  pq-fabric-local:
    name: pq-fabric-local
    internal: true
