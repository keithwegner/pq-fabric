apiVersion: v1
kind: Secret
metadata:
  name: pq-fabric-api-keys
  namespace: pq-fabric
type: Opaque
stringData:
  api-keys.json: "replace-with-scoped-api-key-config"
---
apiVersion: v1
kind: Secret
metadata:
  name: pq-fabric-consortium-manifest
  namespace: pq-fabric
type: Opaque
stringData:
  current.json: "replace-with-current-seven-validator-manifest"
  v1.json: "replace-with-manifest-history-entry"
---
apiVersion: v1
kind: Secret
metadata:
  name: pq-fabric-peer-tls
  namespace: pq-fabric
type: Opaque
stringData:
  ca.crt: "replace-with-consortium-ca"
  validator-1.crt: "replace-with-validator-1-cert-with-spiffe-uri-san"
  validator-1.key: "replace-with-validator-1-private-key"
  validator-2.crt: "replace-with-validator-2-cert-with-spiffe-uri-san"
  validator-2.key: "replace-with-validator-2-private-key"
  validator-3.crt: "replace-with-validator-3-cert-with-spiffe-uri-san"
  validator-3.key: "replace-with-validator-3-private-key"
  validator-4.crt: "replace-with-validator-4-cert-with-spiffe-uri-san"
  validator-4.key: "replace-with-validator-4-private-key"
  validator-5.crt: "replace-with-validator-5-cert-with-spiffe-uri-san"
  validator-5.key: "replace-with-validator-5-private-key"
  validator-6.crt: "replace-with-validator-6-cert-with-spiffe-uri-san"
  validator-6.key: "replace-with-validator-6-private-key"
  validator-7.crt: "replace-with-validator-7-cert-with-spiffe-uri-san"
  validator-7.key: "replace-with-validator-7-private-key"
---
apiVersion: v1
kind: Secret
metadata:
  name: pq-fabric-kms
  namespace: pq-fabric
type: Opaque
stringData:
  token: "replace-with-kms-token"
---
apiVersion: v1
kind: Secret
metadata:
  name: pq-fabric-kms-ca
  namespace: pq-fabric
type: Opaque
stringData:
  ca.crt: "replace-with-kms-ca"
---
apiVersion: v1
kind: Secret
metadata:
  name: pq-fabric-otel
  namespace: pq-fabric
type: Opaque
stringData:
  otlp-headers: ""
