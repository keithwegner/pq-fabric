apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pq-fabric-api-keys
  namespace: pq-fabric
spec:
  secretStoreRef:
    name: pq-fabric-staging-aws-secret-store
    kind: ClusterSecretStore
  target:
    name: pq-fabric-api-keys
  data:
    - secretKey: api-keys.json
      remoteRef:
        key: pq-fabric/staging/api
        property: api-keys.json
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pq-fabric-consortium-manifest
  namespace: pq-fabric
spec:
  secretStoreRef:
    name: pq-fabric-staging-aws-secret-store
    kind: ClusterSecretStore
  target:
    name: pq-fabric-consortium-manifest
  data:
    - secretKey: current.json
      remoteRef:
        key: pq-fabric/staging/manifest
        property: current.json
    - secretKey: v1.json
      remoteRef:
        key: pq-fabric/staging/manifest
        property: history/v1.json
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pq-fabric-peer-tls
  namespace: pq-fabric
spec:
  secretStoreRef:
    name: pq-fabric-staging-aws-secret-store
    kind: ClusterSecretStore
  target:
    name: pq-fabric-peer-tls
  data:
    - secretKey: ca.crt
      remoteRef:
        key: pq-fabric/staging/peer-tls
        property: ca.crt
    - secretKey: validator-1.crt
      remoteRef:
        key: pq-fabric/staging/peer-tls
        property: validator-1.crt
    - secretKey: validator-1.key
      remoteRef:
        key: pq-fabric/staging/peer-tls
        property: validator-1.key
    - secretKey: validator-2.crt
      remoteRef:
        key: pq-fabric/staging/peer-tls
        property: validator-2.crt
    - secretKey: validator-2.key
      remoteRef:
        key: pq-fabric/staging/peer-tls
        property: validator-2.key
    - secretKey: validator-3.crt
      remoteRef:
        key: pq-fabric/staging/peer-tls
        property: validator-3.crt
    - secretKey: validator-3.key
      remoteRef:
        key: pq-fabric/staging/peer-tls
        property: validator-3.key
    - secretKey: validator-4.crt
      remoteRef:
        key: pq-fabric/staging/peer-tls
        property: validator-4.crt
    - secretKey: validator-4.key
      remoteRef:
        key: pq-fabric/staging/peer-tls
        property: validator-4.key
    - secretKey: validator-5.crt
      remoteRef:
        key: pq-fabric/staging/peer-tls
        property: validator-5.crt
    - secretKey: validator-5.key
      remoteRef:
        key: pq-fabric/staging/peer-tls
        property: validator-5.key
    - secretKey: validator-6.crt
      remoteRef:
        key: pq-fabric/staging/peer-tls
        property: validator-6.crt
    - secretKey: validator-6.key
      remoteRef:
        key: pq-fabric/staging/peer-tls
        property: validator-6.key
    - secretKey: validator-7.crt
      remoteRef:
        key: pq-fabric/staging/peer-tls
        property: validator-7.crt
    - secretKey: validator-7.key
      remoteRef:
        key: pq-fabric/staging/peer-tls
        property: validator-7.key
---
